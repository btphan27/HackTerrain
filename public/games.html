<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game ideas | HackHub</title>
  <meta name="description" content="Game ideas to build at a hackathon.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">HackHub</a>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="catalog.html">Hackathons</a></li>
          <li><a href="games.html" aria-current="page">Game ideas</a></li>
          <li><a href="info.html">Hackathon info</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="container">
      <div class="page-title">
        <h1>Game ideas</h1>
        <p>Pick a game to build for your next hackathon.</p>
      </div>

      <form id="challenge-form" class="filters" aria-label="Generate a challenge">
        <label>Topic
          <select name="topic">
            <option value="problem-solving">Problem solving</option>
            <option value="teamwork">Team work</option>
            <option value="project-brainstorming">Project brainstorming</option>
            <option value="mvp">Minimum viable product</option>
            <option value="pitching">Pitching</option>
          </select>
        </label>
        <label>Difficulty
          <select name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button class="btn" type="submit">Generate challenge</button>
      </form>
      
      <div id="challenge-result"></div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-grid">
      <p>&copy; 2026 HackHub</p>
      <nav aria-label="Footer">
        <ul class="nav-list">
          <li><a href="catalog.html">Hackathons</a></li>
          <li><a href="games.html">Game ideas</a></li>
          <li><a href="info.html">Hackathon info</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
